    <path d="M159 390h34M264 390h34" stroke="#2b1745" stroke-width="13" stroke-linecap="round"/>
    <path d="M151 178l-46 67M287 178l52 40" stroke="#7a4a32" stroke-width="17" stroke-linecap="round"/>
    <circle cx="339" cy="218" r="5" fill="#7a4a32"/>
    <path d="M338 218l-1-55" stroke="#2b1745" stroke-width="4"/>
    <path d="M337 163h35" stroke="#2b1745" stroke-width="4"/>
  </g>

  <!-- student 1 -->
  <g transform="translate(285 205)">
    <circle cx="92" cy="56" r="31" fill="#c78962"/>
    <path d="M64 55c4-36 56-43 64-5-16-10-34-12-64 5z" fill="#17131b"/>
    <path d="M51 125c8-42 72-48 85 0l10 96H42z" fill="#2b1745"/>
