<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Students learning with a professor</title>
  <desc id="desc">A diverse professor leads a small classroom discussion with three young adult students.</desc>
  <defs>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6f5" stop-opacity=".92"/>
      <stop offset="1" stop-color="#f7f0e4" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <ellipse cx="375" cy="500" rx="295" ry="34" fill="#2b1745" opacity=".10"/>
  <circle cx="535" cy="128" r="118" fill="url(#soft)"/>
  <path d="M438 120h190v126H438z" fill="#fff" opacity=".8" stroke="#cbbfd3" stroke-width="3"/>
  <path d="M456 144h155M456 169h125M456 194h143" stroke="#d9b979" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  <path d="M448 222h171" stroke="#6b3fa0" stroke-width="8" stroke-linecap="round" opacity=".25"/>

